[project]
name = "magic-gamma-telescope"
version = "1.0.0"
description = "Gamma/hadron shower classification on MAGIC telescope features: MLP + classical baselines, leakage analysis, pytest"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
